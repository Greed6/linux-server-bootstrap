# linux-start — файл ответов / answers file
#
#   sudo ./linux-start.sh -c answers.conf        # спросит только то, чего нет в файле
#   sudo ./linux-start.sh -c answers.conf -y     # вообще без вопросов
#
# Любой вопрос можно заранее ответить переменной LS_<КЛЮЧ>.
# Закомментированная переменная = вопрос будет задан (или взят default при -y).
# Да/нет: y|n. Файл содержит секреты — храните с правами 600.

# ---- Общее / General ----
LS_LANG=ru                         # ru | en — язык меню / menu language
LS_RU_LOCALE=y                     # первый запуск: русская локаль по умолчанию
LS_MODULES="repos upgrade auto-updates hostname timezone ntp swap sysctl journald base-tools nano mc micro ssh-keys ssh-hardening ufw fail2ban selinux-apparmor"
LS_CONFIRM=y
LS_MENU_AGAIN=n

# ---- repos ----
LS_DEBIAN_STANDARD_SOURCES=y
LS_DEBIAN_BACKPORTS=n
LS_UBUNTU_UNIVERSE=y
LS_CENTOS_VAULT=y
LS_EPEL=y

# ---- auto-updates ----
LS_AUTO_REBOOT=n
#LS_AUTO_REBOOT_TIME=04:00

# ---- system ----
#LS_LOCALE_CHOICE=1                # 1 = ru_RU.UTF-8, 2 = en_US.UTF-8
#LS_HOSTNAME=srv1.example.ru
LS_TIMEZONE=Europe/Moscow
LS_NTP_SERVERS="ru.pool.ntp.org"
#LS_SWAP_SIZE=2G
LS_SWAPPINESS=10
LS_JOURNAL_MAX_SIZE=500M
LS_JOURNAL_RETENTION=1month

# ---- software ----
#LS_BASE_PACKAGES="curl wget htop git rsync tmux bash-completion unzip lsof tree jq"

# ---- docker ----
#LS_DOCKER_LOG_ROTATION=y
#LS_DOCKER_USER=admin             # «-» — никого не добавлять в группу docker
#LS_DOCKER_UFW=y

# ---- ssh ----
LS_SSH_USER=admin
LS_SSH_CREATE_USER=y
#LS_SSH_USER_PASSWORD='...'
#LS_SSH_KEYS="ssh-ed25519 AAAA... user@laptop"
#LS_SSH_KEYS_URL=https://github.com/<user>.keys
#LS_SSH_KEYS_FILE=/root/admin.pub
LS_SSH_DISABLE_ROOT=y
#LS_SSH_PORT=2222
#LS_SSH_KEEP_22=y
#LS_SSH_CLOSE_22=n

# ---- firewall / protection ----
LS_FIREWALLD_FALLBACK=y
#LS_TRUSTED_IPS="203.0.113.10 10.0.0.0/8"
#LS_CROWDSEC_LAPI_PORT=8080
#LS_CROWDSEC_LAPI_EXTERNAL=n
#LS_CROWDSEC_ENROLL_KEY=...
#LS_CROWDSEC_ENROLL_NAME=srv1

# ---- telegram ----
#LS_TELEGRAM_BOT_TOKEN=123456:ABC...
#LS_TELEGRAM_CHAT_ID=123456789
#LS_TELEGRAM_TEST=y
