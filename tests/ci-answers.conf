# Ответы для автотестов в Docker / answers for Docker tests
# Ключ LS_SSH_KEYS подставляет tests/run-tests.sh
LS_LANG=ru
LS_RU_LOCALE=y
LS_CONFIRM=y
LS_MODULES="${LS_TEST_MODULES:-repos auto-updates timezone ntp sysctl journald base-tools nano mc micro ssh-keys ssh-port ssh-hardening ufw fail2ban selinux-apparmor}"

LS_ASTRA_ONLINE_REPOS=y
LS_DEBIAN_STANDARD_SOURCES=y
LS_DEBIAN_BACKPORTS=n
LS_UBUNTU_UNIVERSE=y
LS_CENTOS_VAULT=y
LS_EPEL=y
LS_AUTO_REBOOT=n

LS_TIMEZONE=Europe/Moscow
LS_NTP_SERVERS="ru.pool.ntp.org"
LS_JOURNAL_MAX_SIZE=200M
LS_JOURNAL_RETENTION=2weeks
LS_BASE_PACKAGES="curl htop tmux jq"

LS_SSH_USER=admin
LS_SSH_CREATE_USER=y
LS_SSH_DISABLE_ROOT=y
LS_SSH_PORT=2222
LS_SSH_KEEP_22=y

LS_TRUSTED_IPS="192.0.2.1"
LS_CROWDSEC_LAPI_PORT=8081
LS_CROWDSEC_LAPI_EXTERNAL=y
